# Build & push the SAM 3 video-handler image to ghcr.io.
# Triggered manually or on changes to the pod's Dockerfile/handler.
# The pushed image is what the local driver pulls when it spins up
# the RunPod pod.
name: sam3-video-pod

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/segmentation_sam3_video/pod/Dockerfile'
      - 'experiments/segmentation_sam3_video/pod/handler.py'
      - 'experiments/segmentation_sam3_video/chunking.py'
      - '.github/workflows/sam3-video-pod.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Stage pod build context
        run: |
          # The Dockerfile lives under experiments/.../pod but COPYs
          # both handler.py and chunking.py — the latter is one dir
          # up. Stage everything in one folder so the build context
          # is self-contained.
          mkdir -p _build_ctx
          cp experiments/segmentation_sam3_video/pod/Dockerfile _build_ctx/
          cp experiments/segmentation_sam3_video/pod/handler.py _build_ctx/
          cp experiments/segmentation_sam3_video/chunking.py _build_ctx/

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sam3-video
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - uses: docker/build-push-action@v5
        with:
          context: _build_ctx
          file: _build_ctx/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
